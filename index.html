<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ea">
  <title>Matrix Scratchpad</title>
  <meta name="description" content="A scratchpad for matrices: edit freely, do row operations, and see step-by-step explanations of linear algebra operations.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f7f3ea'/><path d='M9 6H6v20h3M23 6h3v20h-3' stroke='%2323324d' stroke-width='2.5' fill='none'/><text x='16' y='20' font-size='11' text-anchor='middle' fill='%23d6453d' font-family='serif'>A</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=10">
</head>
<body>
  <header class="topbar">
    <div class="brand" title="Matrix Scratchpad"><span class="brand-mark">[ A ]</span><span class="brand-name">Matrix Scratchpad</span></div>
    <div class="cmd-wrap">
      <span class="cmd-prompt">ƒ</span>
      <input id="cmd" class="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="C = A*B · inv(A) · rref(A) · det(A) · A^T · solve(A, b)">
      <div id="cmd-msg" class="cmd-msg" hidden></div>
    </div>
    <nav class="tools">
      <button id="btn-new" class="tb primary" title="New matrix (N)"><span class="ico">＋</span><span class="lbl">Matrix</span></button>
      <button id="btn-note" class="tb" title="New note"><span class="ico">✎</span><span class="lbl">Note</span></button>
      <button id="btn-undo" class="tb icon" title="Undo (Ctrl+Z)">↶</button>
      <button id="btn-redo" class="tb icon" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button id="btn-explain" class="tb accent" title="Step-by-step explainer (Shift+E)"><span class="ico">☰</span><span class="lbl">Explainer</span></button>
      <button id="btn-menu" class="tb icon" title="More">⋯</button>
    </nav>
  </header>

  <div id="toolbar" class="toolbar" role="toolbar" aria-label="Drawing tools"></div>
  <aside id="props" class="props" hidden></aside>
  <main id="stage" class="stage">
    <div id="world" class="world"></div>
    <div id="marquee" class="marquee" hidden></div>
    <div class="zoom-ctl">
      <button id="zoom-out" title="Zoom out">−</button>
      <button id="zoom-reset" title="Reset zoom">100%</button>
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-fit" title="Fit all">⤢</button>
    </div>
    <div id="selbar" class="selbar" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <div id="pages" class="pages"></div>
  </main>

  <aside id="explainer" class="explainer" aria-label="Explainer" hidden>
    <div class="ex-resize" id="ex-resize"></div>
    <div class="ex-head">
      <h2>Explainer</h2>
      <button id="ex-hist" class="tb small" title="Everything you have run in the explainer">🕘 History</button>
      <button id="ex-wide" class="tb icon" title="Expand">⤢</button>
      <button id="ex-close" class="tb icon" title="Close (Esc)">✕</button>
    </div>
    <div class="ex-body">
      <section class="ex-form">
        <label class="ex-row"><span>Operation</span><select id="ex-op"></select></label>
        <div id="ex-inputs"></div>
        <div id="ex-options"></div>
        <div class="ex-actions">
          <button id="ex-steps" class="tb primary">Step by step</button>
          <button id="ex-answer" class="tb">Just the answer</button>
        </div>
      </section>
      <section id="ex-out" class="ex-out"></section>
    </div>
  </aside>

  <div id="popover" class="popover" hidden></div>
  <div id="modal" class="modal" hidden></div>

  <script src="js/fraction.js?v=10"></script>
  <script src="js/matrix.js?v=10"></script>
  <script src="js/ops.js?v=10"></script>
  <script src="js/expr.js?v=10"></script>
  <script src="js/ocr.js?v=10"></script>
  <script src="js/render.js?v=10"></script>
  <script src="js/editor.js?v=10"></script>
  <script src="js/draw.js?v=10"></script>
  <script src="js/explainer.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
